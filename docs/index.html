<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>微信意图助手 · 在线版</title>
<meta name="description" content="粘贴好友发来的消息, 判断对方真实意图, 给出三条不同打法的回复, 每条都写明理由、风险和优势。纯前端运行, 不依赖服务器。" />
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --line: #e2e5ea;
    --line-strong: #cfd4dc;
    --text: #171d2b;
    --muted: #6a7280;
    --accent: #0f766e;
    --accent-soft: #e6f2f0;
    --reason: #1d4ed8;
    --reason-soft: #eaeffd;
    --risk: #b45309;
    --risk-soft: #fdf1e3;
    --adv: #15803d;
    --adv-soft: #e8f5ec;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans SC",
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header.bar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: var(--surface);
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; }
  .brand svg { color: var(--accent); }
  .brand a { color: inherit; text-decoration: none; }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; }
  .dot.on { background: var(--accent); }
  .spacer { flex: 1; }
  .field { display: flex; align-items: center; gap: 8px; }
  .field label { font-size: 12px; color: var(--muted); }
  input.contact, input.setting, textarea {
    font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--radius); padding: 6px 10px; outline: none;
  }
  input.contact { width: 110px; }
  input.setting { width: 100%; font-size: 13px; }
  input.contact:focus, input.setting:focus, textarea:focus { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); overflow: hidden; }
  .seg button {
    font: inherit; font-size: 12px; padding: 5px 12px; border: 0;
    background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line-strong); }
  .seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { display: flex; flex: 1; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane.in { flex: 0 0 380px; border-right: 1px solid var(--line); background: var(--surface); }
  .pane.out { flex: 1; min-width: 0; }
  .pane-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  .pane-head .title { font-weight: 600; color: var(--text); font-size: 13px; }
  .pane-body { flex: 1; min-height: 0; overflow-y: auto; }
  .pane.in .pane-body { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px 18px; }
  textarea#chat { flex: 1; min-height: 200px; resize: none; line-height: 1.7; }
  .hint { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  button.btn {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    font: inherit; font-size: 13px; padding: 8px 14px; border-radius: var(--radius);
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    cursor: pointer;
  }
  button.btn:hover { border-color: #aab2be; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; }
  button.btn.primary:hover { background: #0d6a63; }
  button.btn:disabled { opacity: .55; cursor: default; }
  details.setup {
    background: var(--surface); border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  details.setup > summary {
    cursor: pointer; padding: 8px 20px; color: var(--muted); font-size: 12px;
    list-style: none;
  }
  details.setup > summary::-webkit-details-marker { display: none; }
  details.setup > summary::before { content: "▸ "; }
  details.setup[open] > summary::before { content: "▾ "; }
  .setup-body {
    padding: 4px 20px 14px; display: grid; gap: 8px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    align-items: end;
  }
  .setup-body .wide { grid-column: 1 / -1; }
  .setup-body label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .results { padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; }
  .readout { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .readout-top { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .row1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .intent-name { font-size: 18px; font-weight: 700; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #eef1f5; color: #4b5563; border: 1px solid var(--line);
  }
  .badge.accent { background: var(--accent-soft); color: var(--accent); border-color: #bcdcd8; }
  .badge.risk { background: var(--risk-soft); color: var(--risk); border-color: #f0d3ac; }
  .conf { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .conf .bar { flex: 1; max-width: 260px; height: 5px; background: #eceff3; border-radius: 999px; overflow: hidden; }
  .conf .bar i { display: block; height: 100%; background: var(--accent); }
  .conf span { font-size: 12px; color: var(--muted); }
  dl.meta { margin: 0; padding: 12px 16px; display: grid; grid-template-columns: 74px 1fr; gap: 6px 12px; font-size: 13px; }
  dl.meta dt { color: var(--muted); font-size: 12px; padding-top: 2px; }
  dl.meta dd { margin: 0; }
  .signals { padding: 0 16px 14px; }
  .signals .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: #f1f3f6; border: 1px solid var(--line); color: #45505f; }
  .reply { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  .reply.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .reply-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 14px; border-bottom: 1px solid var(--line); background: #fafbfc;
  }
  .reply-head .name { font-weight: 600; font-size: 13px; }
  .reply-head .tone { font-size: 12px; color: var(--muted); }
  .iconbtn {
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 12px; color: var(--muted);
    background: transparent; border: 1px solid var(--line-strong);
    border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  .iconbtn:hover { color: var(--text); border-color: #aab2be; }
  .iconbtn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .bubble { padding: 14px 16px 4px; font-size: 14.5px; line-height: 1.75; }
  .why { padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .why .item { display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: start; }
  .why .tag { font-size: 11px; font-weight: 600; text-align: center; padding: 2px 0; border-radius: 5px; }
  .tag.reason { color: var(--reason); background: var(--reason-soft); }
  .tag.risk { color: var(--risk); background: var(--risk-soft); }
  .tag.adv { color: var(--adv); background: var(--adv-soft); }
  .why .txt { font-size: 13px; color: #37404f; }
  .empty { padding: 60px 24px; text-align: center; color: var(--muted); }
  .empty svg { color: #c3c9d2; margin-bottom: 10px; }
  .empty p { margin: 4px 0; font-size: 13px; }
  .err { margin: 16px 18px; padding: 10px 14px; border-radius: var(--radius);
         background: var(--risk-soft); color: var(--risk); font-size: 13px; border: 1px solid #f0d3ac; }
  .foot { padding: 12px 18px 28px; font-size: 12px; color: var(--muted); max-width: 900px; }
  .foot a { color: var(--accent); }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    .pane.in { flex: 0 0 auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .pane.in .pane-body { max-height: 42vh; }
    textarea#chat { min-height: 140px; }
    .results { padding: 14px 12px 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      微信意图助手
    </div>
    <span class="status"><i class="dot" id="dot"></i><span id="mode">离线规则引擎</span></span>
    <div class="spacer"></div>
    <div class="field">
      <label for="contact">好友备注</label>
      <input class="contact" id="contact" value="小雨" />
    </div>
    <div class="seg" id="engine">
      <button data-force="auto" class="active">自动</button>
      <button data-force="offline">离线</button>
    </div>
  </header>

  <details class="setup" id="setup">
    <summary>模型设置(可选)：填了就用模型生成，不填就用内置规则，一样能用</summary>
    <div class="setup-body">
      <div>
        <label for="baseUrl">接口地址(Base URL)</label>
        <input class="setting" id="baseUrl" placeholder="https://api.deepseek.com/v1" />
      </div>
      <div>
        <label for="model">模型名</label>
        <input class="setting" id="model" placeholder="deepseek-chat" />
      </div>
      <div class="wide">
        <label for="apiKey">API Key(只存在你本机浏览器里, 不上传)</label>
        <input class="setting" id="apiKey" type="password" placeholder="sk-..." />
      </div>
      <div class="wide hint" id="setupHint">
        任何 OpenAI 兼容的 chat/completions 接口都行。浏览器直连可能被对方接口的跨域(CORS)策略拦下,
        被拦时会自动退回离线规则引擎并在结果里说明, 不会卡住。
      </div>
    </div>
  </details>

  <main>
    <section class="pane in">
      <div class="pane-head">
        <span class="title">对话输入</span>
        <span class="spacer"></span>
        <span>每条一行</span>
      </div>
      <div class="pane-body">
        <textarea id="chat" spellcheck="false"></textarea>
        <div class="hint">「好友: 内容」标出对方说的，「我: 内容」标出你说的。没有前缀就按对方消息处理。</div>
        <div class="actions">
          <button class="btn primary" id="run">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
            分析意图
          </button>
          <button class="btn" id="demo">示例</button>
          <button class="btn" id="clear">清空</button>
        </div>
      </div>
    </section>
    <section class="pane out">
      <div class="pane-head">
        <span class="title">意图判读与回复建议</span>
        <span class="spacer"></span>
        <button class="iconbtn" id="copyJson" hidden>复制 JSON</button>
        <span id="engineTag"></span>
      </div>
      <div class="pane-body" id="out">
        <div class="empty">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/>
            <path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>
          </svg>
          <p>把好友刚发来的消息贴到左边，点「分析意图」。</p>
          <p>会给出意图判读，以及三条不同打法的回复，每条都写明理由、风险和优势。</p>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="./engine.js"></script>
<script src="./llm.js"></script>
<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var out = $("out");
  var force = "auto";
  var lastResult = null;

  var DEFAULT_CONFIG = { baseUrl: "https://api.deepseek.com/v1", apiKey: "", model: "deepseek-chat", temperature: 0.7, timeout: 60 };
  var STORE_KEY = "wechat-intent-llm-config";

  var DEMO = [
    "小雨: 在吗",
    "小雨: 最近真的好累，感觉快撑不住了",
    "我: 怎么了",
    "小雨: 项目被砍了，我做了三个月的东西全白费",
    "小雨: 你能陪我说说话吗"
  ].join("\n");

  function esc(value) {
    var map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" };
    return String(value == null ? "" : value).replace(/[&<>"]/g, function (c) { return map[c]; });
  }

  function loadConfig() {
    var config = { baseUrl: DEFAULT_CONFIG.baseUrl, apiKey: "", model: DEFAULT_CONFIG.model, temperature: 0.7, timeout: 60 };
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      if (saved.baseUrl) { config.baseUrl = saved.baseUrl; }
      if (saved.model) { config.model = saved.model; }
      if (saved.apiKey) { config.apiKey = saved.apiKey; }
    } catch (err) { /* 读不到就用默认值 */ }
    return config;
  }

  var config = loadConfig();

  function saveConfig() {
    config.baseUrl = $("baseUrl").value.trim() || DEFAULT_CONFIG.baseUrl;
    config.model = $("model").value.trim() || DEFAULT_CONFIG.model;
    config.apiKey = $("apiKey").value.trim();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(config)); } catch (err) { /* 隐私模式下忽略 */ }
    refreshStatus();
  }

  function refreshStatus() {
    var ready = WXLLM.ready(config);
    $("dot").classList.toggle("on", ready);
    $("mode").textContent = ready ? ("模型 " + config.model) : "离线规则引擎";
  }

  function reasonRow(kind, label, text) {
    return '<div class="item"><span class="tag ' + kind + '">' + label +
      '</span><span class="txt">' + esc(text) + "</span></div>";
  }

  function replyCard(reply, index) {
    var badge = reply.recommended ? '<span class="badge accent">推荐</span>' : "";
    return [
      '<article class="reply" data-i="' + index + '">',
      '  <div class="reply-head">',
      '    <span class="name">' + esc(reply.strategy_label) + "</span>" + badge,
      '    <span class="tone">' + esc(reply.tone) + "</span>",
      '    <span class="spacer"></span>',
      '    <button class="iconbtn pick" data-i="' + index + '">',
      '      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"',
      '           stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>用这条',
      "    </button>",
      '    <button class="iconbtn copy" data-i="' + index + '">',
      '      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"',
      '           stroke-linecap="round" stroke-linejoin="round">',
      '        <rect x="9" y="9" width="13" height="13" rx="2"/>',
      '        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制',
      "    </button>",
      "  </div>",
      '  <div class="bubble">' + esc(reply.text) + "</div>",
      '  <div class="why">',
      reasonRow("reason", "理由", reply.reason),
      reasonRow("risk", "风险", reply.risk),
      reasonRow("adv", "优势", reply.advantage),
      "  </div>",
      "</article>"
    ].join("\n");
  }

  function render(data) {
    lastResult = data;
    $("engineTag").textContent = data.engine === "llm" ? "模型生成" : "离线规则";
    $("copyJson").hidden = false;
    var pct = data.confidence_pct != null ? data.confidence_pct : Math.round(data.confidence * 100);
    var note = data.note ? '<div class="err" style="margin:0 0 14px">' + esc(data.note) + "</div>" : "";
    var signals = (data.signals || []).map(function (s) {
      return '<span class="chip">' + esc(s) + "</span>";
    }).join("");
    var cards = (data.replies || []).map(replyCard).join("\n");
    var urgencyClass = data.urgency === "高" ? "badge risk" : "badge";

    out.innerHTML = [
      '<div class="results">',
      note,
      '  <div class="readout">',
      '    <div class="readout-top">',
      '      <div class="row1">',
      '        <span class="intent-name">' + esc(data.intent_label) + "</span>",
      '        <span class="badge">情绪 ' + esc(data.emotion_label) + "</span>",
      '        <span class="' + urgencyClass + '">紧急度 ' + esc(data.urgency) + "</span>",
      "      </div>",
      '      <div class="conf"><span>置信度 ' + pct + '%</span>',
      '        <span class="bar"><i style="width:' + pct + '%"></i></span></div>',
      "    </div>",
      '    <dl class="meta">',
      "      <dt>对方意图</dt><dd>" + esc(data.read) + "</dd>",
      "      <dt>对方想要</dt><dd>" + esc(data.goal) + "</dd>",
      "      <dt>建议</dt><dd>" + esc(data.advice) + "</dd>",
      "    </dl>",
      '    <div class="signals"><div class="label">判读依据</div>',
      '      <div class="chips">' + signals + "</div></div>",
      "  </div>",
      cards,
      '  <div class="foot">建议只作参考，发不发、怎么发由你决定。这个页面不会自动回复任何人，也不联网(除非你自己填了模型接口)。</div>',
      "</div>"
    ].join("\n");

    out.querySelectorAll(".copy").forEach(function (button) {
      button.addEventListener("click", function () {
        var reply = data.replies[Number(button.dataset.i)];
        copyText(reply.text).then(function () {
          button.classList.add("active");
          setTimeout(function () { button.classList.remove("active"); }, 1200);
        });
      });
    });

    out.querySelectorAll(".pick").forEach(function (button) {
      button.addEventListener("click", function () {
        out.querySelectorAll(".reply").forEach(function (el) { el.classList.remove("picked"); });
        out.querySelectorAll(".pick").forEach(function (el) { el.classList.remove("active"); });
        var index = Number(button.dataset.i);
        out.querySelector('.reply[data-i="' + index + '"]').classList.add("picked");
        button.classList.add("active");
      });
    });
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    try {
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      document.body.removeChild(area);
    } catch (err) { /* 复制不可用时静默忽略 */ }
  }

  function run() {
    var text = $("chat").value.trim();
    var contact = $("contact").value.trim() || "好友";
    if (!text) { return; }
    $("run").disabled = true;
    var messages = WXEngine.parseTranscript(text, contact);
    WXLLM.analyze(messages, contact, force, config).then(function (data) {
      render(data);
    }).catch(function (err) {
      out.innerHTML = '<div class="err">分析失败：' + esc(err && err.message ? err.message : err) + "</div>";
    }).finally(function () {
      $("run").disabled = false;
    });
  }

  $("run").addEventListener("click", run);
  $("clear").addEventListener("click", function () { $("chat").value = ""; $("chat").focus(); });
  $("demo").addEventListener("click", function () {
    $("contact").value = "小雨";
    $("chat").value = DEMO;
    run();
  });
  $("copyJson").addEventListener("click", function () {
    if (!lastResult) { return; }
    copyText(JSON.stringify(lastResult, null, 2)).then(function () {
      var button = $("copyJson");
      button.classList.add("active");
      setTimeout(function () { button.classList.remove("active"); }, 1200);
    });
  });
  $("engine").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) { return; }
    force = button.dataset.force;
    $("engine").querySelectorAll("button").forEach(function (el) {
      el.classList.toggle("active", el === button);
    });
    if (force === "offline") { $("setup").open = false; }
  });
  ["baseUrl", "model", "apiKey"].forEach(function (id) {
    $(id).addEventListener("change", saveConfig);
    $(id).addEventListener("blur", saveConfig);
  });
  document.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") { run(); }
  });

  $("baseUrl").value = config.baseUrl === DEFAULT_CONFIG.baseUrl ? "" : config.baseUrl;
  $("model").value = config.model === DEFAULT_CONFIG.model ? "" : config.model;
  $("apiKey").value = config.apiKey || "";
  refreshStatus();

  $("chat").value = DEMO;
  run();
})();
</script>
</body>
</html>
